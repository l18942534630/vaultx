version: 2.1

jobs:
  build:
    docker:
      - image: cimg/python:3.11
    resource_class: large
    steps:
      - checkout
      
      - run:
          name: Install system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y git openjdk-17-jdk-headless zlib1g-dev libssl-dev libffi-dev autoconf libtool pkg-config libncurses5-dev cmake automake wget lzip
      
      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            pip install buildozer kivy cryptography cython
      
      - run:
          name: Build APK
          command: |
            cd android
            buildozer android debug
          no_output_timeout: 30m
      
      - store_artifacts:
          path: android/bin/
          destination: apk

workflows:
  version: 2
  build:
    jobs:
      - build
