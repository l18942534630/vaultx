name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk zlib1g-dev libssl-dev automake libtool
    
    - name: Inspect pre-installed Android SDK
      run: |
        echo "=== Pre-installed SDK location ==="
        ls -la /usr/local/lib/android/sdk/ 2>/dev/null || echo "Not at /usr/local"
        ls -la /opt/android* 2>/dev/null || echo "Not at /opt"
        
        # Search for sdkmanager
        echo "=== Searching for sdkmanager ==="
        find /usr /opt /home -name "sdkmanager" 2>/dev/null | head -10
    
    - name: Setup Android SDK - Fix tools/bin structure
      run: |
        SDK_ROOT=/usr/local/lib/android/sdk
        
        # Check actual structure
        echo "=== Actual SDK structure ==="
        ls -la $SDK_ROOT/
        
        # Find where cmdline-tools is
        if [ -d "$SDK_ROOT/cmdline-tools" ]; then
          echo "cmdline-tools found"
          ls -la $SDK_ROOT/cmdline-tools/
          ls -la $SDK_ROOT/cmdline-tools/*/bin/ 2>/dev/null || echo "No bin"
        fi
        
        # If no cmdline-tools, download it
        if [ ! -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          echo "Downloading cmdline-tools..."
          mkdir -p $SDK_ROOT/cmdline-tools
          cd $SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest 2>/dev/null || true
          rm -f tools.zip
        fi
        
        # Create tools/bin structure (buildozer expects this)
        mkdir -p $SDK_ROOT/tools/bin
        if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          cp $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $SDK_ROOT/tools/bin/
          cp $SDK_ROOT/cmdline-tools/latest/bin/*.jar $SDK_ROOT/tools/bin/ 2>/dev/null || true
          echo "Copied sdkmanager to tools/bin"
        fi
        
        # Verify
        ls -la $SDK_ROOT/tools/bin/sdkmanager 2>/dev/null && echo "SUCCESS" || echo "FAILED"
    
    - name: Accept Android SDK licenses
      run: |
        SDK_ROOT=/usr/local/lib/android/sdk
        mkdir -p $SDK_ROOT/licenses
        printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\nd975f751698a77b662f1254ddbeed3901e976f5a\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
        printf "\n" > $SDK_ROOT/licenses/android-sdk-preview-license
        echo "Licenses accepted"
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        # Use system SDK directly (don't symlink to .buildozer)
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
        export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
        
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
