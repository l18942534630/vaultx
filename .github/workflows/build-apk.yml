name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk zlib1g-dev libssl-dev automake libtool
    
    - name: Setup Android SDK
      run: |
        SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_ROOT
        
        # Link pre-installed SDK
        ln -sf /usr/local/lib/android/sdk $SDK_ROOT
        
        echo "=== SDK structure ==="
        ls -la $SDK_ROOT/
        ls -la $SDK_ROOT/cmdline-tools/ 2>/dev/null || echo "No cmdline-tools"
        ls -la $SDK_ROOT/tools/ 2>/dev/null || echo "No tools"
        
        # Find sdkmanager
        echo "=== Finding sdkmanager ==="
        find $SDK_ROOT -name "sdkmanager" 2>/dev/null | head -5
        
        # Create tools/bin if needed
        mkdir -p $SDK_ROOT/tools/bin
        
        # If cmdline-tools/latest/bin/sdkmanager exists, copy to tools/bin
        if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          cp $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $SDK_ROOT/tools/bin/
          cp $SDK_ROOT/cmdline-tools/latest/bin/*.jar $SDK_ROOT/tools/bin/ 2>/dev/null || true
          echo "Copied sdkmanager from cmdline-tools"
        fi
        
        # Verify
        if [ -f "$SDK_ROOT/tools/bin/sdkmanager" ]; then
          echo "SUCCESS: sdkmanager at $SDK_ROOT/tools/bin/sdkmanager"
        else
          echo "WARNING: sdkmanager still missing"
          find $SDK_ROOT -name "sdkmanager" 2>/dev/null
        fi
    
    - name: Setup Android NDK
      run: |
        NDK_ROOT=$HOME/.buildozer/android/platform/android-ndk-r25b
        mkdir -p $(dirname $NDK_ROOT)
        ln -sf /usr/local/lib/android/sdk/ndk/27.3.13750724 $NDK_ROOT
        echo "NDK linked: $NDK_ROOT"
        ls -la $NDK_ROOT/ 2>/dev/null | head -5
    
    - name: Accept Android SDK licenses
      run: |
        SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_ROOT/licenses
        printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\nd975f751698a77b662f1254ddbeed3901e976f5a\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
        printf "\n" > $SDK_ROOT/licenses/android-sdk-preview-license
        echo "Licenses accepted"
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
