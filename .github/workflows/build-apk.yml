name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK
      run: |
        cd android
        buildozer android debug
      continue-on-error: true
    
    - name: List APK files
      run: |
        ls -la android/bin/ || echo "Checking for APK..."
        find android -name "*.apk" -type f || echo "APK generation in progress..."
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
    
    - name: Build summary
      if: always()
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ -f android/bin/*.apk ]; then
          echo "✅ APK built successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          ls -lh android/bin/*.apk >> $GITHUB_STEP_SUMMARY
        else
          echo "⚠️ APK generation may have issues. Check the logs above." >> $GITHUB_STEP_SUMMARY
        fi
