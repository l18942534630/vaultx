name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Android SDK
      uses: android-actions/setup-android@v3
      with:
        sdk-root: ${{ runner.temp }}/android-sdk
    
    - name: Accept SDK licenses
      run: |
        mkdir -p ${{ runner.temp }}/android-sdk/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\nd975f751698a77b662f1254ddbeed3901e976f5a\n8933bad161af4178b1185d1a37fbf41ea5269c55" > ${{ runner.temp }}/android-sdk/licenses/android-sdk-license
        echo -e "\n" > ${{ runner.temp }}/android-sdk/licenses/android-sdk-preview-license
        echo "Licenses accepted"
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=${{ runner.temp }}/android-sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=${{ runner.temp }}/android-sdk/ndk/25b
        
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk
        ANDROID_HOME: ${{ runner.temp }}/android-sdk
        ANDROID_NDK_HOME: ${{ runner.temp }}/android-sdk/ndk/25b
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
