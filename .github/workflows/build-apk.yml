name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk zlib1g-dev libssl-dev automake libtool
    
    - name: Setup Android SDK
      run: |
        BUILDOZER_SDK=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $BUILDOZER_SDK
        cd $BUILDOZER_SDK
        
        # Check if already set up
        if [ -f "$BUILDOZER_SDK/tools/bin/sdkmanager" ]; then
          echo "SDK already configured"
        else
          echo "Setting up SDK..."
          # Download and extract
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline.zip
          unzip -q cmdline.zip
          rm -f cmdline.zip
          
          # Determine structure
          if [ -d "cmdline-tools/latest" ]; then
            mkdir -p tools
            cp -r cmdline-tools/latest/bin tools/
            cp -r cmdline-tools/latest/lib tools/ 2>/dev/null || true
            cp -r cmdline-tools/latest/source.tools tools/ 2>/dev/null || true
            rm -rf cmdline-tools
          elif [ -d "cmdline-tools" ]; then
            mkdir -p tools
            find cmdline-tools -type f -name "*.jar" -exec cp {} tools/ \; 2>/dev/null || true
            find cmdline-tools -type d -name "bin" -exec cp -r {} tools/ \; 2>/dev/null || true
            rm -rf cmdline-tools
          fi
        fi
        
        echo "=== SDK Status ==="
        ls -la tools/bin/sdkmanager 2>/dev/null && echo "SDKMANAGER OK" || echo "SDKMANAGER MISSING"
        ls -la tools/lib/*.jar 2>/dev/null | wc -l | xargs echo "JAR files:"
        
        # Accept licenses
        mkdir -p $BUILDOZER_SDK/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\nd975f751698a77b662f1254ddbeed3901e976f5a\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $BUILDOZER_SDK/licenses/android-sdk-license
        echo -e "\n" > $BUILDOZER_SDK/licenses/android-sdk-preview-license
    
    - name: Setup Android NDK
      run: |
        NDK_TARGET=$HOME/.buildozer/android/platform/android-ndk-r25b
        mkdir -p $(dirname $NDK_TARGET)
        if [ ! -d "$NDK_TARGET" ]; then
          if [ -d /usr/local/lib/android/sdk/ndk/27.3.13750724 ]; then
            cp -r /usr/local/lib/android/sdk/ndk/27.3.13750724 $NDK_TARGET
          fi
        fi
        echo "NDK ready: $(ls $NDK_TARGET 2>/dev/null | head -1)"
    
    - name: Accept SDK licenses and install build-tools
      run: |
        SDK=$HOME/.buildozer/android/platform/android-sdk
        export JAVA_HOME=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.18-8/x64
        
        if [ -f "$SDK/tools/bin/sdkmanager" ]; then
          yes | $SDK/tools/bin/sdkmanager --licenses 2>/dev/null || true
          $SDK/tools/bin/sdkmanager "build-tools;34.0.0" 2>/dev/null || true
          $SDK/tools/bin/sdkmanager "platforms;android-34" 2>/dev/null || true
        fi
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b
        
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
