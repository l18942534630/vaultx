name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk zlib1g-dev libssl-dev automake libtool
    
    - name: Setup Android SDK and NDK
      run: |
        SDK_ROOT=/usr/local/lib/android/sdk
        
        # Accept all licenses
        mkdir -p $SDK_ROOT/licenses
        mkdir -p $SDK_ROOT/licenses_opt
        
        # Write all known Android SDK license keys
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $SDK_ROOT/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $SDK_ROOT/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_ROOT/licenses/android-sdk-license
        echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> $SDK_ROOT/licenses/android-sdk-license
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" >> $SDK_ROOT/licenses/android-sdk-license
        echo -e "\n" > $SDK_ROOT/licenses/android-sdk-preview-license
        
        # Create tools/bin for buildozer
        mkdir -p $SDK_ROOT/tools/bin
        if [ -f "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
          cp $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager $SDK_ROOT/tools/bin/
          cp $SDK_ROOT/cmdline-tools/latest/bin/*.jar $SDK_ROOT/tools/bin/ 2>/dev/null || true
        fi
        
        echo "=== License files ==="
        ls -la $SDK_ROOT/licenses/
        cat $SDK_ROOT/licenses/android-sdk-license
        
        # Install build-tools using sdkmanager
        echo "=== Installing build-tools ==="
        yes | $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
        $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
        
        echo "=== Installed packages ==="
        $SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --list_installed 2>/dev/null | head -20
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/27.3.13750724
        
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        ANDROID_HOME: /usr/local/lib/android/sdk
        ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/27.3.13750724
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
