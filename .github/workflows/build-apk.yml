name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk zlib1g-dev libssl-dev
    
    - name: Accept Android SDK licenses
      run: |
        mkdir -p $HOME/.android
        touch $HOME/.android/repositories.cfg
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.android/debug.keystore
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/.android/debug.keystore
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $HOME/android-sdk-license
        echo "d975f751698a77b662f1254ddbeed3901e976f5a" >> $HOME/android-sdk-license
        echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> $HOME/android-sdk-license
        echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> $HOME/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> $HOME/android-sdk-license
        echo -e "\n" > $HOME/android-sdk-preview-license
        export ANDROID_HOME=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
    
    - name: Create Android SDK directory
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" >> $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo "" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
