name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Android SDK via action
      uses: android-actions/setup-android@v3
      with:
        sdk-root: ${{ runner.temp }}/android-sdk
    
    - name: Link SDK to buildozer path
      run: |
        # buildozer uses $HOME/.buildozer/android/platform/android-sdk
        # create symlink from action's SDK to buildozer's expected path
        mkdir -p $HOME/.buildozer/android/platform
        rm -rf $HOME/.buildozer/android/platform/android-sdk
        ln -sf ${{ runner.temp }}/android-sdk $HOME/.buildozer/android/platform/android-sdk
        echo "SDK linked to buildozer path"
        ls -la $HOME/.buildozer/android/platform/android-sdk/
    
    - name: Accept SDK licenses
      run: |
        mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\nd975f751698a77b662f1254ddbeed3901e976f5a\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n" > $HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
    
    - name: Install build-tools
      run: |
        SDK=$HOME/.buildozer/android/platform/android-sdk
        # Find sdkmanager
        SDKMANAGER=$(find $SDK -name "sdkmanager" -type f 2>/dev/null | head -1)
        if [ -n "$SDKMANAGER" ]; then
          echo "Found sdkmanager: $SDKMANAGER"
          export JAVA_HOME=/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.18-8/x64
          yes | $SDKMANAGER --licenses 2>/dev/null || true
          $SDKMANAGER "build-tools;34.0.0" 2>/dev/null || true
          echo "=== Installed packages ==="
          $SDKMANAGER --list_installed 2>/dev/null | grep build-tools
        else
          echo "ERROR: sdkmanager not found"
        fi
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-25b
        
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-25b
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
