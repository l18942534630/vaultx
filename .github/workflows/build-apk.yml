name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk zlib1g-dev libssl-dev automake libtool
    
    - name: Setup Android SDK
      run: |
        # Buildozer uses $HOME/.buildozer/android/platform/android-sdk
        BUILDOZER_SDK=$HOME/.buildozer/android/platform/android-sdk
        
        # Create directory
        mkdir -p $BUILDOZER_SDK
        
        # Copy from system SDK
        if [ -d /usr/local/lib/android/sdk ]; then
          echo "Copying from system SDK..."
          cp -r /usr/local/lib/android/sdk/. $BUILDOZER_SDK/ 2>/dev/null || true
        fi
        
        # Create tools/bin structure (buildozer checks tools/bin/sdkmanager)
        mkdir -p $BUILDOZER_SDK/tools/bin
        
        # Find and copy sdkmanager
        if [ -f "$BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
          cp $BUILDOZER_SDK/cmdline-tools/latest/bin/sdkmanager $BUILDOZER_SDK/tools/bin/
          cp $BUILDOZER_SDK/cmdline-tools/latest/bin/*.jar $BUILDOZER_SDK/tools/bin/ 2>/dev/null || true
          echo "Copied sdkmanager from cmdline-tools"
        elif [ -f "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
          cp /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager $BUILDOZER_SDK/tools/bin/
          cp /usr/local/lib/android/sdk/cmdline-tools/latest/bin/*.jar $BUILDOZER_SDK/tools/bin/ 2>/dev/null || true
          echo "Copied sdkmanager from system SDK"
        fi
        
        # Accept licenses
        mkdir -p $BUILDOZER_SDK/licenses
        echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd\nd56f5187479451eabf01fb78af6dfcb131a6481e\nd975f751698a77b662f1254ddbeed3901e976f5a\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $BUILDOZER_SDK/licenses/android-sdk-license
        echo -e "\n" > $BUILDOZER_SDK/licenses/android-sdk-preview-license
        
        # Verify
        echo "=== Final structure ==="
        ls -la $BUILDOZER_SDK/tools/bin/sdkmanager 2>/dev/null && echo "SDKMANAGER OK" || echo "SDKMANAGER MISSING"
        ls -la $BUILDOZER_SDK/licenses/ 2>/dev/null
        
    - name: Setup Android NDK
      run: |
        NDK_TARGET=$HOME/.buildozer/android/platform/android-ndk-r25b
        mkdir -p $(dirname $NDK_TARGET)
        
        # Copy from system NDK
        if [ -d /usr/local/lib/android/sdk/ndk/27.3.13750724 ]; then
          cp -r /usr/local/lib/android/sdk/ndk/27.3.13750724 $HOME/.buildozer/android/platform/android-ndk-r25b
          echo "NDK copied"
        fi
        ls -la $NDK_TARGET/ 2>/dev/null | head -3
    
    - name: Accept SDK licenses via sdkmanager
      run: |
        SDK=$HOME/.buildozer/android/platform/android-sdk
        if [ -f "$SDK/tools/bin/sdkmanager" ]; then
          yes | $SDK/tools/bin/sdkmanager --licenses 2>/dev/null || true
          $SDK/tools/bin/sdkmanager "build-tools;34.0.0" 2>/dev/null || true
          echo "Licenses accepted and build-tools installed"
        else
          echo "sdkmanager not found at $SDK/tools/bin/sdkmanager"
          find $SDK -name "sdkmanager" 2>/dev/null
        fi
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer kivy cryptography cython
    
    - name: Build APK with Buildozer
      run: |
        export ANDROID_SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
        export ANDROID_HOME=$ANDROID_SDK_ROOT
        export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b
        
        cd android
        buildozer android debug
      env:
        ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
        ANDROID_NDK_HOME: /home/runner/.buildozer/android/platform/android-ndk-r25b
      continue-on-error: true
    
    - name: List build output
      if: always()
      run: |
        echo "=== Build output ==="
        ls -la android/bin/ 2>/dev/null || echo "bin directory not found"
        find android -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
    
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: vaultx-apk
        path: android/bin/*.apk
        retention-days: 30
        if-no-files-found: warn
